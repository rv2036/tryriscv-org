home_stats_vendors: "производителей чипов"
home_stats_ips: "проверяемых IP-ядер"
home_stats_solutions: "пакетов решений"
home_stats_note: "Пустое поле энергопотребления означает, что производитель не публикует сопоставимых данных, а не нулевое потребление; значения, пересчитанные из мА, сопровождаются условиями на странице."
home_latest_eyebrow: "Последние добавления"
home_latest_title: "Недавно добавленные в базу компоненты"
home_latest_desc: "Сортировка по году выпуска и дате проверки. У каждой записи есть ссылка на страницу производителя или даташит."
home_latest_all: "Все модели"
home_why_eyebrow: "Почему здесь"
home_why_title: "Это не очередной рекламный проспект"
home_why_desc: "«Можно найти» превращается в «можно сравнить, проследить и исправить» — в этом отличие сайта от обычного списка продуктов."
home_why_1_title: "Структурированные параметры"
home_why_1_desc: "Частота, SRAM, Flash, динамическое потребление/сон/ожидание, число экземпляров периферии, корпус, температура, экосистема — единые поля с комбинируемой фильтрацией."
home_why_2_title: "Прослеживаемые источники"
home_why_2_desc: "В каждой записи сохраняются ссылки на официальную страницу продукта / даташит и уровень достоверности; неопубликованное остаётся пустым, без оценочных значений."
home_why_3_title: "Сообщество может исправить"
home_why_3_desc: "Автоматический сбор с помощью AI не застрахован от ошибок. Отправьте issue одной кнопкой внизу страницы, указав модель и источник, — исправление попадёт в следующий снимок данных."
home_eco_eyebrow: "Карта экосистемы"
home_eco_title: "В Китае есть альянсы RISC-V, но нет единой базы для подбора"
home_eco_desc: "RISC-V International отвечает за стандарты, CRVIC / CRVA развивают отрасль и открытую экосистему. Данные по компонентам с возможностью сравнения по-прежнему разрознены — именно эту нишу и закрывает tryriscv.org."
home_eco_all: "Перейти к экосистеме"
home_cta_title: "Не нашли подходящую модель? Расскажите о задаче."
home_cta_desc: "Сценарий, частота, память, периферия, энергопотребление, срок выхода в серию — опишите эти шесть пунктов, и мы оформим повторяемую часть в новый пакет решений и ответим со списком кандидатов в issue."
home_cta_ask_short: "Хочу подобрать"
home_cta_report: "Сообщить об ошибке"

