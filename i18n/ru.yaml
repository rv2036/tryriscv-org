home_presets_eyebrow: "Прямой доступ к запросам"
home_presets_title: "Два реальных ограничения клиентов уже стали условиями фильтра"
home_presets_desc: "«Нужен малопотребляющий продукт около 100 МГц», «можно уложиться в 64 КБ памяти и 40 МГц». Нажмите — условия подставятся, дальше подстройте под проект."
