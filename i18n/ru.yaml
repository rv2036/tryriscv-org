ai_roadmap_eyebrow: "План развития"
ai_roadmap_title: "Далее: зрелость совместимости моделей и версий ПО"
ai_roadmap_desc: "Аппаратная производительность — только начало. Реальный срок проекта определяют «запустится ли модель на вашей версии инструментария, насколько упадёт точность после квантования и полностью ли покрыты операторы». В будущем каждая запись AI будет дополнена матрицей ниже."
ai_roadmap_1_title: "Производительность и точность"
ai_roadmap_1_desc: "Пиковые INT8 / INT4 / FP16, пропускная способность памяти, потребление и энергоэффективность, корпус и интерфейсы."
ai_roadmap_2_title: "Версии инструментария"
ai_roadmap_2_desc: "Комбинации версий SDK, компилятора, инструментов квантования, драйверов и Runtime, шаги установки и воспроизведения."
ai_roadmap_3_title: "Модели и операторы"
ai_roadmap_3_desc: "Экспорт ONNX / TFLite / PyTorch, покрытие операторов, динамические shape, регрессия точности после квантования."
ai_disclaimer: "Сейчас страница охватывает только публично доступные характеристики оборудования и сведения об инструментарии. Для позиций без публичных бенчмарков оценки не придумываются; присылайте результаты измерений или исправления параметров в GitHub Issues."

