home_stats_note: "An empty power field means the vendor has not published comparable data; it does not mean zero power. Values converted from mA state their conditions on the detail page."
home_latest_eyebrow: "Latest additions"
home_latest_title: "Recently added to the catalog"
home_latest_desc: "Ordered by release year and verification date. Every record links to a vendor product page or datasheet."
home_latest_all: "All parts"
home_why_eyebrow: "Why here"
home_why_title: "Not another vendor brochure"
home_why_desc: "Turning “searchable” into “comparable, traceable, correctable” is what sets this site apart from an ordinary product list."
home_why_1_title: "Structured parameters"
home_why_1_desc: "Clock speed, SRAM, Flash, active/sleep/standby power, peripheral instance counts, package, temperature, and ecosystem share one field set and combine in filters."
home_why_2_title: "Traceable sources"
home_why_2_desc: "Every record keeps its official product page or datasheet link plus a confidence level; if a value is not published, the field stays empty instead of being filled with an estimate."
home_why_3_title: "Community corrections"
home_why_3_desc: "AI extraction will make mistakes. One click at the bottom of the page files an issue; with the part number and a source, the fix lands in the next data snapshot."
home_eco_eyebrow: "Ecosystem map"
home_eco_title: "China has RISC-V alliances, but no unified selection library"
home_eco_desc: "RISC-V International owns the standard; CRVIC and CRVA drive the industry and open-source ecosystem. Device-level, comparable data is still scattered — exactly the gap tryriscv.org fills."
home_eco_all: "See ecosystem entry points"
home_cta_title: "Nothing fits? Tell us what you need."
home_cta_desc: "Scenario, clock speed, memory, peripherals, power, and time to production — spell out these six and we will turn the reusable parts into a new solution package and reply with a candidate list in the issue."
home_cta_ask_short: "Get a recommendation"
home_cta_report: "Report a data error"

