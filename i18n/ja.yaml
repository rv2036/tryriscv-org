ai_roadmap_title: "次のステップ：モデル / ソフトウェアバージョンの適合成熟度"
ai_roadmap_desc: "ハードウェアの演算性能は出発点にすぎません。プロジェクト期間を実際に左右するのは、「このモデルが自分のツールチェーンのバージョンで動くか、量子化後の精度低下はどれくらいか、演算子のカバレッジは十分か」です。今後、各 AI レコードは以下のマトリクスへ拡張されます。"
ai_roadmap_1_title: "演算性能と精度"
ai_roadmap_1_desc: "INT8 / INT4 / FP16 のピーク性能、メモリ帯域、消費電力と電力効率、パッケージとインターフェース。"
ai_roadmap_2_title: "ツールチェーンのバージョン"
ai_roadmap_2_desc: "SDK、コンパイラ、量子化ツール、ドライバ、Runtime のバージョン組み合わせと、インストール・再現手順。"
ai_roadmap_3_title: "モデルと演算子"
ai_roadmap_3_desc: "ONNX / TFLite / PyTorch からの変換、演算子カバレッジ、動的 shape、量子化後の精度回帰。"
ai_disclaimer: "現在のページは、公開情報で確認できるハードウェア仕様とツールチェーン情報のみを扱っています。公開ベンチマークがない項目にスコアをでっち上げることはしません。実測データやパラメータの訂正は GitHub Issues で歓迎します。"

