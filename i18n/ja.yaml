home_why_eyebrow: "なぜここなのか"
home_why_title: "もう一つのメーカー宣伝冊子ではありません"
home_why_desc: "「調べられる」を「比べられる、追跡できる、訂正できる」に変えること。それが一般的な製品リストとの違いです。"
home_why_1_title: "構造化されたパラメータ"
home_why_1_desc: "クロック、SRAM、Flash、動作時/スリープ/スタンバイ消費電力、ペリフェラル数、パッケージ、温度、エコシステムを統一フィールドで管理し、組み合わせて絞り込めます。"
home_why_2_title: "出典を追跡できる"
home_why_2_desc: "各レコードに公式製品ページ / データシートへのリンクと信頼度を保持します。非公開の情報は推定値で埋めず、空欄のままにします。"
home_why_3_title: "コミュニティが訂正できる"
home_why_3_desc: "AI による自動取得では誤りが避けられません。ページ末尾から型番と出典を添えて issue を送ると、修正は次回のデータスナップショットに反映されます。"
home_eco_eyebrow: "エコシステムマップ"
home_eco_title: "中国の RISC-V にはアライアンスがあるが、統一された選定ライブラリはない"
home_eco_desc: "標準を策定するのは RISC-V International、産業とオープンソースのエコシステムを推進するのは CRVIC / CRVA です。それでもデバイス単位で比較できるデータは分散したまま——そこが tryriscv.org の埋めたい位置です。"
home_eco_all: "エコシステムの入口を見る"
home_cta_title: "合う型番が見つかりませんか。要件をそのままお知らせください。"
home_cta_desc: "用途、クロック、メモリ、ペリフェラル、消費電力、量産時期——この 6 項目を書いていただければ、再利用できる部分は新しいソリューションパッケージとして整理し、issue で候補リストをお返しします。"
home_cta_ask_short: "選びたい"
