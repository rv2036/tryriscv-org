# Тексты и настройки уровня сайта (не данные об устройствах)
title: tryriscv.org
tagline: "Подбор RISC-V — это просто"
subtitle: "Открытая, фильтруемая и сравниваемая база данных RISC-V MCU / IP / решений"

# Пояснение к методике подсчёта на главной странице
stats_note: "Данные взяты с сайтов производителей, из даташитов и открытых источников и собраны с помощью AI; актуальные параметры — в последней версии даташита."

# Частые запросы клиентов («прямой доступ к потребностям» на главной), query — параметры фильтра /mcu/
presets:
  - id: iot-100m
    title: "IoT: образование и производство · 100 МГц, низкое потребление"
    desc: "64–128 МГц; приоритет — низкое динамическое потребление и ток сна. Подходит для сенсорных узлов, учебных платформ и серийных IoT-устройств."
    query: "freq=64-128&sort=run-asc&has_power=1"
    tag: "Запрос клиента"
  - id: tiny-40m
    title: "Минимальные ресурсы · 40 МГц / 64 КБ Flash"
    desc: "Частота ≤ 64 МГц, Flash 32–128 КБ, приоритет — низкое потребление; по распространённой трактовке «64 КБ памяти = Flash». Если имеется в виду SRAM, задайте нижнюю границу SRAM 64 КБ."
    query: "freq=0-64&flash=32-128&has_power=1&sort=run-asc"
    tag: "Запрос клиента"
  - id: wireless
    title: "Беспроводная связь · BLE / Wi-Fi"
    desc: "RISC-V SoC со встроенными BLE или Wi-Fi: меньше внешней радиочастотной обвязки и затрат на сертификацию."
    query: "peri=ble,wifi&sort=freq-asc"
    tag: "Сценарий"
  - id: motor
    title: "Управление двигателями · FOC"
    desc: "12-битный ADC, комплементарный PWM, компараторы и операционные усилители — для вентиляторов, насосов и поворотных приводов."
    query: "peri=pwm,adc,comp&adc=12&sort=price-asc"
    tag: "Сценарий"

# Организации экосистемы (используются на главной и в /ecosystem/)
orgs:
  - name: RISC-V International
    region: "Швейцария / весь мир"
    url: https://riscv.org/
    desc: "Разработчик глобальных стандартов набора инструкций и расширений RISC-V: отвечает за спецификации ISA, сертификацию и развитие экосистемы."
  - name: 中国 RISC-V 产业联盟（CRVIC）
    region: "Китай · Шанхай"
    url: http://www.risc-v.org.cn/
    desc: "Китайский отраслевой альянс RISC-V, способствующий взаимодействию в области IP, чипов, инструментария и подготовки кадров."
  - name: 中国开放指令生态（RISC-V）联盟（CRVA）
    region: "Китай · Пекин"
    url: https://crva.ict.ac.cn/
    desc: "Создан по инициативе Института вычислительной техники Академии наук Китая; занимается экосистемой открытого набора инструкций, процессором XiangShan и открытым сообществом."
  - name: RISC-V 基金会中国社区
    region: "Китай"
    url: https://riscv.org/community/
    desc: "Вход в сообщество глобального фонда в Китае: мероприятия, технические рабочие группы и встречи разработчиков."
