- id: iot-edu
  title: "Учебно-прототипная платформа IoT: образование и производство"
  category: "Обучение и прототипирование"
  summary: "На основе малопотребляющих RISC-V MCU класса 100 МГц: сбор данных с датчиков, отладка через USB, сеть CAN/последовательный порт, лабораторные работы по RTOS и курсовые проекты; учитываются стоимость прототипов и полнота документации."
  needs: [64–144 МГц, SRAM от 20 КБ, USB/CAN, RT-Thread, 5V-толерантные входы]
  specs:
    freq: "64–144 МГц"
    sram: "20–64 КБ"
    flash: "64–256 КБ"
    power: "динамика 49–186 µA/МГц"
  recommended: [wch-ch32v203c8t6, gigadevice-gd32vf103c8t6, wch-ch32v103c8t6, cmiot-cm32m433r]
  why:
    - "WCH CH32V203: 144 МГц, 49 µA/МГц, два USB, CAN; есть MounRiver Studio и BSP для RT-Thread — хороший основной контроллер для курса."
    - "GD32VF103: зрелая экосистема Nuclei N200, много примеров и отладочных плат — удобен для сравнительного обучения и экспериментов по портированию."
    - "CH32V103: питание 5 В и USB FS, совместимость с 5-вольтовыми модулями датчиков — проще проектировать питание стенда."
    - "CMIOT CM32M433R: 144 МГц, 144 КБ SRAM, два CAN и китайские криптоалгоритмы SM3/SM4 — для продвинутых работ и темы локализации компонентов."
  risks:
    - "Ни у одной из перечисленных моделей нет встроенного радио; для экспериментов с BLE/Wi-Fi нужен внешний модуль или переход на ESP32-C3 / CH582M."
    - "Цены зависят от партии и канала продаж; при закупке для обучения нужно запрашивать коммерческое предложение у дистрибьютора."
    - "У CH32V203 всего 20 КБ SRAM: при работе с графическим интерфейсом или большим стеком протоколов нужно следить за расходом памяти."
  toolchain: [MounRiver Studio, Nuclei Studio, RT-Thread Studio, GCC, OpenOCD]
  query: "freq=64-160&sram=16-64&sort=run-asc&has_power=1"
  updated: 2026-11-04

- id: battery-sensor
  title: "Автономный сенсорный узел с батарейным питанием (40 МГц / 64 КБ)"
  category: "Малопотребляющие датчики"
  summary: "Для автономных узлов измерения температуры и влажности, тока, положения двери, счётчиков воды. Достаточно частоты около 48 МГц и SRAM 4–64 КБ; главное — удержать ток сна ниже 10 µA и сохранить достаточный запас ADC и компараторов."
  needs: [24–96 МГц, SRAM 4–64 КБ, сон <10 µA, 12-битный ADC, малый корпус]
  specs:
    freq: "24–96 МГц"
    sram: "4–64 КБ"
    flash: "16–128 КБ"
    power: "сон 0,37–10 µA"
  recommended: [wch-ch32l103c8t6, wch-ch32v006k8u7, apt-apt32f1023, wch-ch32v002f4p6]
  why:
    - "CH32L103: 96 МГц при 49 µA/МГц, режим ожидания 0,37 µA, LPUART/LPTIM — подходит для длительного сбора данных."
    - "CH32V006: 48 МГц, 8 КБ SRAM, 62 КБ Flash, малый корпус QFN, периферии хватает для многоканального опроса ADC."
    - "APT32F1023 от APT: 48 МГц, 4 КБ SRAM, 64 КБ Flash; в официальной таблице указан глубокий сон 5 µA — явная ориентация на стоимость."
    - "CH32V002: минимальный вариант с 4 КБ SRAM и 16 КБ Flash — для схемы с одним измерением и пробуждением по беспроводному модулю."
  risks:
    - "Инструментарий и материалы сообщества у APT беднее, чем у WCH; до серии нужно заложить время на портирование и отладку."
    - "Производители измеряют потребление в разных условиях (напряжение, температура, тактирование периферии), поэтому параметры нужно перепроверить на своей плате."
    - "В малопотребляющих режимах объём сохраняемой RAM и число источников пробуждения ограничивают выбор стека протоколов."
  toolchain: [MounRiver Studio, APT IDE, GCC, RT-Thread]
  query: "freq=0-100&sram=0-64&has_power=1&sort=sleep-asc"
  updated: 2026-11-04

- id: ble-device
  title: "BLE-устройства: носимые гаджеты и умный дом"
  category: "Беспроводная связь"
  summary: "RISC-V SoC со встроенным BLE: не нужны внешний радиотракт и затраты на сертификацию. Для носимых устройств важны ток сна и корпус, для умного дома — стек Mesh/Matter и запас Flash."
  needs: [BLE 5.x, сон <3 µA, Flash от 256 КБ, LCD/сенсор — опционально]
  specs:
    freq: "20–96 МГц"
    sram: "26–512 КБ"
    flash: "448 КБ–4 МБ"
    power: "сон 0,7–2,6 µA"
    wireless: "BLE 5.0–5.4"
  recommended: [wch-ch582m, telink-tlsr9218, wch-ch592f, bouffalo-bl702c-10-q2h]
  why:
    - "CH582M: BLE 5.0, сон 0,7 µA, 448 КБ Flash; официальный стек BLE и примеры полные — подходит для носимых устройств и HID."
    - "Telink TLSR9218: 96 МГц, 256 КБ SRAM, 2 МБ Flash, сон 0,7 µA — для устройств с большими буферами и OTA."
    - "CH592F: BLE 5.4 и драйвер сегментного LCD — для термостатов, панелей и устройств с дисплеем."
    - "Bouffalo Lab BL702: BLE + USB, 132 КБ SRAM — для периферии, где нужны USB и беспроводная связь одновременно."
  risks:
    - "Сертификация BLE (BQB/FCC/CE) сильно зависит от версии стека; при выборе убедитесь, что SDK поддерживает нужный протокол."
    - "У части моделей частота 20 МГц ограничивает запас при одновременной работе дисплея и беспроводного стека."
    - "Разделы OTA и зарезервированные области во встроенном Flash сокращают доступное пространство."
  toolchain: [MounRiver Studio, Telink IoT Studio, Bouffalo SDK, RT-Thread]
  query: "peri=ble&sort=sleep-asc"
  updated: 2026-11-04

- id: wifi-appliance
  title: "Wi-Fi для умной бытовой техники и лёгких шлюзов"
  category: "Беспроводная связь"
  summary: "Основной контроллер бытовой техники, розетки и шлюзы датчиков требуют Wi-Fi + BLE, достаточного объёма SRAM для TLS/MQTT и надёжного OTA. Приоритет — платформы со зрелым SDK и готовой интеграцией с облаком."
  needs: [Wi-Fi 4/6, подключение по BLE, SRAM от 320 КБ, OTA, безопасная загрузка]
  specs:
    freq: "120–320 МГц"
    sram: "272–532 КБ"
    flash: "2–8 МБ"
    power: "динамика 100–172 µA/МГц"
    wireless: "Wi-Fi + BLE"
  recommended: [espressif-esp32-c3fh4, espressif-esp32-c6fh4, bouffalo-bl616c-50-q2i, gigadevice-gd32vw553kiq7]
  why:
    - "ESP32-C3: одно ядро RISC-V 160 МГц, 400 КБ SRAM, Wi-Fi + BLE 5; самая полная экосистема ESP-IDF и Matter, много материалов для серийного производства."
    - "ESP32-C6: Wi-Fi 6 + BLE 5 + 802.15.4 — для бытовой техники нового поколения с Thread/Matter."
    - "Bouffalo Lab BL616: 320 МГц, 532 КБ SRAM, Wi-Fi 6 + BLE — для чувствительных к цене шлюзов, которым нужна большая вычислительная мощность."
    - "GD32VW553: Nuclei N307 + Wi-Fi 6 + BLE — плавный переход для команд, уже работающих на MCU GigaDevice."
  risks:
    - "Радиосертификация и проектирование антенны — основные барьеры; готовый модуль обычно выходит в серию быстрее, чем решение на чипе."
    - "Пиковый ток Wi-Fi может достигать сотен мА; питание и развязку нужно рассчитывать по пиковому потреблению."
    - "Для Wi-Fi 6 в ESP32-C6 нужно проверить совместимость с роутерами и бюджет энергопотребления целевого сценария."
  toolchain: [ESP-IDF, Bouffalo SDK, MounRiver Studio, GCC]
  query: "peri=wifi&sort=run-asc"
  updated: 2026-11-04

- id: motor-foc
  title: "Управление двигателями и FOC"
  category: "Управление двигателями"
  summary: "Вентиляторы, насосы, поворотные приводы и электроинструмент требуют ADC от 12 бит, комплементарного PWM, компараторов/операционных усилителей и CAN. RISC-V MCU на 105–144 МГц уже закрывают FOC одного двигателя; для двух двигателей важен запас каналов PWM и ADC."
  needs: [от 100 МГц, 12-битный ADC, комплементарный PWM, CAN, компараторы/операционные усилители]
  specs:
    freq: "96–144 МГц"
    sram: "16–64 КБ"
    flash: "64–256 КБ"
    power: "динамика 49–186 µA/МГц"
  recommended: [apt-apt32f1730, wch-ch32v203c8t6, wch-ch32v303vct6, gigadevice-gd32vf103c8t6]
  why:
    - "APT32F1730 от APT: 105 МГц, FPU/DSP, CAN; ориентирован на двигатели и цифровое питание, набор периферии оптимизирован под PWM/ADC."
    - "CH32V203: 144 МГц, два USB, CAN, 49 µA/МГц — для компактных приводов со связью с верхним уровнем."
    - "CH32V303: 144 МГц, 64 КБ SRAM, 256 КБ Flash, CAN — ресурсов достаточно для двух двигателей или сложной логики защит."
    - "GD32VF103: 108 МГц, два CAN, 12-битный ADC, зрелая экосистема — удобен как стенд для проверки алгоритмов управления."
  risks:
    - "Управление двигателем чувствительно к моменту выборки ADC, мёртвому времени PWM и полосе операционных усилителей; проверять нужно на реальной силовой плате."
    - "Для части моделей число каналов PWM не указано в открытых источниках — до выбора уточните у производителя."
    - "Изоляция, драйверы затворов и измерение тока относятся к аналоговой схемотехнике; MCU — лишь один из элементов."
  toolchain: [MounRiver Studio, APT IDE, Nuclei Studio, GCC]
  query: "peri=can,pwm&adc=12&sort=run-asc"
  updated: 2026-11-04

- id: industrial-edge
  title: "Промышленная автоматика и граничные шлюзы"
  category: "Промышленная автоматика"
  summary: "Нужны CAN/CAN FD, Ethernet, широкий температурный диапазон и безопасная загрузка. Класс 144 МГц подходит для преобразования протоколов и управления оборудованием, двухъядерные решения от 600 МГц — для граничных вычислений и многоосевого управления."
  needs: [CAN/Ethernet, широкий температурный диапазон, Flash от 256 КБ, безопасная загрузка, несколько UART]
  specs:
    freq: "144–816 МГц"
    sram: "64 КБ–1 МБ"
    flash: "0–992 КБ"
    power: "динамика 85–184 µA/МГц"
  recommended: [wch-ch32v307vct6, cmiot-cm32m433r, hpmicro-hpm6360, wch-ch32v407vet6]
  why:
    - "CH32V307: 144 МГц, 64 КБ SRAM, 256 КБ Flash, два CAN и Ethernet PHY 10M — для управления оборудованием и преобразования протоколов."
    - "CMIOT CM32M433R: 144 МГц, 144 КБ SRAM, 512 КБ Flash, два CAN, китайские криптоалгоритмы SM3/SM4 — для задач локализации и безопасности."
    - "HPMicro HPM6360: 600 МГц, 512 КБ SRAM, CAN + Ethernet — для многоосевых систем с жёстким реальным временем и граничных алгоритмов."
    - "CH32V407: 200 МГц, 200 КБ SRAM, 992 КБ Flash, Ethernet и USB HS — для промышленных HMI с дисплеем."
  risks:
    - "У HPM6360 нет встроенного Flash: нужен внешний NOR/HyperFlash, а также учёт времени загрузки и BOM."
    - "Промышленные условия предъявляют высокие требования к EMC, изоляции и температурному диапазону — проверять нужно по стандартам готового изделия."
    - "Встроенный ли Ethernet PHY и нужен ли внешний трансформатор — это напрямую влияет на разводку платы и стоимость."
  toolchain: [MounRiver Studio, HPM SDK, Nuclei Studio, RT-Thread, Zephyr]
  query: "freq=100-1000&peri=can,eth&sort=freq-asc"
  updated: 2026-11-04
