<!doctype html>
<html lang="{{ site.Language.LanguageCode }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body class="page-{{ with .Section }}{{ . }}{{ else }}home{{ end }}{{ if .IsHome }} is-home{{ end }} lang-{{ site.Language.Lang }}">
  <a class="skip-link" href="#main">{{ i18n "common_skip" }}</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "disclaimer.html" . }}
  {{ partial "footer.html" . }}
  <script>window.__TR_I18N__ = {{ partial "js-i18n.html" . | safeJS }};</script>
  {{ $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
