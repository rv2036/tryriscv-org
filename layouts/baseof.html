<!doctype html>
<html lang="zh-CN">
<head>
  {{ partial "head.html" . }}
</head>
<body class="page-{{ with .Section }}{{ . }}{{ else }}home{{ end }}{{ if .IsHome }} is-home{{ end }}">
  <a class="skip-link" href="#main">跳到主要内容</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "disclaimer.html" . }}
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
