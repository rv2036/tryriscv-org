{{- $s := .Section -}}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="tryriscv.org 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
          <rect x="2" y="2" width="28" height="28" rx="8" fill="#1f4ed8"/>
          <path d="M10 22V10h6.2c2.6 0 4.3 1.5 4.3 3.9 0 1.8-1 3.1-2.6 3.6l3.3 4.5h-3.4l-2.8-4.1h-2v4.1H10Zm3-6.6h2.8c1.3 0 2-.6 2-1.5s-.7-1.5-2-1.5H13v3Z" fill="#fff"/>
          <path d="M23 10.5 27 14l-4 3.5v-7Z" fill="#5eead4"/>
        </svg>
      </span>
      <span class="brand-text"><strong>tryriscv</strong><span>.org</span></span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="{{ "/mcu/" | relURL }}"{{ if eq $s "mcu" }} class="is-active" aria-current="page"{{ end }}>MCU 选型</a>
      <a href="{{ "/ip/" | relURL }}"{{ if eq $s "ip" }} class="is-active" aria-current="page"{{ end }}>IP 核</a>
      <a href="{{ "/solutions/" | relURL }}"{{ if eq $s "solutions" }} class="is-active" aria-current="page"{{ end }}>解决方案</a>
      <a href="{{ "/ai/" | relURL }}"{{ if eq $s "ai" }} class="is-active" aria-current="page"{{ end }}>AI 算力</a>
      <a href="{{ "/ecosystem/" | relURL }}"{{ if eq $s "ecosystem" }} class="is-active" aria-current="page"{{ end }}>生态图谱</a>
      <a href="{{ "/about/" | relURL }}"{{ if eq $s "about" }} class="is-active" aria-current="page"{{ end }}>关于</a>
    </nav>

    <div class="header-actions">
      <a class="btn btn--primary btn--sm header-cta" href="{{ site.Params.issue_select }}" target="_blank" rel="noopener">我想选</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="打开导航">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
