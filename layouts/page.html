{{ define "main" }}
<section class="page-head">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="breadcrumb"><a href="{{ site.Home.RelPermalink }}">{{ i18n "nav_home" }}</a><span>/</span><span>{{ .Title }}</span></nav>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </div>
</section>
<div class="wrap">
  <article class="prose" style="padding:28px 0 64px">
    {{ .Content }}
  </article>
</div>
{{ end }}
